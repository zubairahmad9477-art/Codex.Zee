<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | CodeWithZee</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #e2e8f0;
            background: #0b1120;
        }

        .error-box {
            max-width: 600px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            color: #94a3b8;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            color: #0b1120;
            background: #38bdf8;
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .home-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 90px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="error-box">

        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you are looking for doesn't exist
            or may have been moved.
        </p>

        <a href="./" class="home-btn">
            ← Back to Home
        </a>

    </div>

</body>

</html>
